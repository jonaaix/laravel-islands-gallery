<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="frame-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="gallery-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0" />
    </linearGradient>

    <clipPath id="photo">
      <rect x="46" y="50" width="108" height="72" rx="8" />
    </clipPath>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
  </defs>

  <rect x="8" y="8" width="184" height="184" rx="36" fill="url(#bg-core)" stroke="#334155" stroke-width="1.5" />

  <g fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 6" opacity="0.3">
    <circle cx="100" cy="92" r="62" />
    <circle cx="100" cy="92" r="78" />
  </g>

  <rect x="46" y="50" width="108" height="72" rx="8" fill="url(#frame-surface)" stroke="#334155" stroke-width="1.5" transform="rotate(-9 100 86)" />
  <rect x="46" y="50" width="108" height="72" rx="8" fill="url(#frame-surface)" stroke="#475569" stroke-width="1.5" transform="rotate(6 100 86)" />

  <rect x="46" y="50" width="108" height="72" rx="8" fill="none" stroke="url(#gallery-glow)" stroke-width="7" filter="url(#soft-glow)" opacity="0.85" />

  <rect x="46" y="50" width="108" height="72" rx="8" fill="url(#frame-surface)" />
  <g clip-path="url(#photo)">

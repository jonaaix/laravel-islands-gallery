    <rect x="76" y="140" width="21" height="14" rx="3" fill="#334155" />
    <rect x="103" y="140" width="21" height="14" rx="3" fill="#334155" />
    <rect x="130" y="140" width="21" height="14" rx="3" fill="#334155" opacity="0.6" />

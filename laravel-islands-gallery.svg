    <path d="M 46,122 L 46,104 L 72,82 L 90,98 L 104,88 L 130,110 L 154,96 L 154,122 Z" fill="#38BDF8" opacity="0.55" />
    <path d="M 46,122 L 46,112 L 66,100 L 88,114 L 112,96 L 154,118 L 154,122 Z" fill="#34D399" opacity="0.9" />
  </g>
  <rect x="46" y="50" width="108" height="72" rx="8" fill="none" stroke="url(#gallery-glow)" stroke-width="3" />

  <g fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <polyline points="31,78 23,86 31,94" />
    <polyline points="169,78 177,86 169,94" />
